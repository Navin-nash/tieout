[project]
name = "tieout"
version = "0.1.0"
description = "The close agent that refuses to plug — because plugging is unrepresentable in its tool surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2",
  "pandas>=2",
  "pyyaml>=6",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
agent = ["deepagents>=0.7.13", "langgraph>=0.2", "langchain-anthropic>=0.3", "anthropic>=0.40"]
obs = ["neatlogs>=1.4.21"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
tieout = "tieout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tieout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
