# Alembic configuration for the Tieout platform layer.
#
# There is no sqlalchemy.url here on purpose. migrations/env.py reads DATABASE_URL from the
# environment via tieout.platform.settings, so there is exactly one place a database is named
# and no chance of a checked-in connection string pointing a migration at the wrong server.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# UTC, sortable, so `ls versions/` is chronological.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
